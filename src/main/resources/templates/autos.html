<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Autos</title>
</head>
<body>
    <h1 th:text="${saludo}">Autos</h1>
    <ul>
        <li th:each="a : ${autos}" th:text="${a.modelo} + ' | Placa: ' + ${a.placa} + ' | Año: ' + ${a.anio} + ' | Color: ' + ${a.color} + ' | KM: ' + ${a.kilometraje}">Auto</li>
    </ul>
</body>
</html>
