<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Autos</title>
</head>
<body>
    <h1 th:text="${saludo}">Lista de Autos</h1>

    <ol>
        <li th:each="a : ${autos}" th:text="${a.modelo} + ' - Placa: ' + ${a.placa} + ' - Año: ' + ${a.anio} + ' - Color: ' + ${a.color} + ' - KM: ' + ${a.kilometraje}">Auto</li>
    </ol>
</body>
</html>
