<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asignaturas</title>
</head>
<body>
    <h1 th:text="${saludo}">Reporte de Asignaturas</h1>

    <!-- Tabla simple sin Bootstrap -->
    <table border="1">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Nota 1</th>
                <th>Nota 2</th>
                <th>Nota 3</th>
                <th>Suma</th>
                <th>Mensaje / Estado</th>
            </tr>
        </thead>
        <tbody>
            <!-- Recorremos la lista de asignaturas -->
            <tr th:each="a : ${asignaturas}">
                <td th:text="${a.nombre}">Nombre</td>
                <td th:text="${a.nota1}">0.0</td>
                <td th:text="${a.nota2}">0.0</td>
                <td th:text="${a.nota3}">0.0</td>
                <td th:text="${a.suma}">0.0</td>

                <!-- Validación y mensaje según la suma de notas -->
                <td>
                    <!-- Aprobado (Suma >= 21) -->
                    <span th:if="${a.suma >= 21}">El estudiante ha sido aprobado</span>

                    <!-- Suspenso (Suma entre 18 y 21) -->
                    <span th:if="${a.suma >= 18 and a.suma < 21}">Está suspenso, estudia un poquito más</span>

                    <!-- Reprobado (Suma < 18) -->
                    <span th:if="${a.suma < 18}">Reprobado, tranquilo hay otra matrícula</span>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
